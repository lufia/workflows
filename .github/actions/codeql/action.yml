name: Perform CodeQL Analysis
description: This action performs CodeQL analysis.
inputs:
  language:
    description: A CodeQL languages to analyze.
    required: true

runs:
  using: composite
  steps:
  - uses: github/codeql-action/analyze@0d579ffd059c29b07949a3cce3983f0780820c98 # v4.32.6
    with:
      category: "/language:${{ matrix.language }}"
