name: CodeQL

on:
  workflow_call:

jobs:
  create-matrix:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
    - name: Get languages from the repository
      id: set-matrix
      uses: advanced-security/set-codeql-language-matrix@95b7a2d86fd8b0b9b0952c3d907c9eed04df1953 # v1.3.0-1
      with:
        access-token: ${{ secrets.GITHUB_TOKEN }}
        endpoint: ${{ github.event.repository.languages_url }}

  arrange-matrix:
    needs: create-matrix
    name: "Always include {language=actions, build-mode=none} object"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.add-default-languages.outputs.result }}
    steps:
    - id: add-default-languages
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
      env:
        MATRIX: ${{ needs.create-matrix.outputs.matrix }}
      with:
        script: |
          const matrix = JSON.parse(process.env.MATRIX)
          const action = matrix.include.map(v => v.language).includes('actions') ? [] : [
            { language: 'actions', 'build-mode': 'none' }
          ]
          const json = {
            ...matrix,
            include: [ ...action, ...matrix.include ]
          }
          return JSON.stringify(json)
        result-encoding: string

  analyze:
    needs: arrange-matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.arrange-matrix.outputs.matrix) }}
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ (matrix.language == 'swift' && 'macos-latest') || 'ubuntu-latest' }}
    permissions:
      security-events: write
      packages: read
    steps:
    - name: Checkout repository
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
    - name: Initialize CodeQL
      uses: github/codeql-action/init@0d579ffd059c29b07949a3cce3983f0780820c98 # v4.32.6
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}
    - if: matrix.build-mode == 'manual'
      shell: bash
      run: |
        echo 'If you are using a "manual" build mode for one or more of the' \
          'languages you are analyzing, replace this with the commands to build' \
          'your code, for example:'
        echo '  make bootstrap'
        echo '  make release'
        exit 1
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@0d579ffd059c29b07949a3cce3983f0780820c98 # v4.32.6
      with:
        category: "/language:${{ matrix.language }}"
