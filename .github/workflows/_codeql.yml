name: CodeQL for this repository
on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
  schedule:
  - cron: '17 2 * * 6'
jobs:
  analyze:
    permissions:
      security-events: write
      # needs for private or internal repositories
      #contents: read
    strategy:
      matrix:
        language:
        - actions
        include:
        - build-mode: none
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: ./.github/actions/setup-codeql
      with:
        language: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}
    - uses: ./.github/actions/codeql
      with:
        language: ${{ matrix.language }}
